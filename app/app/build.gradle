def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

android {
    if (buildAsApplication) {
        namespace "org.libsdl.app"
    }
    compileSdkVersion 34

    // NDK 路径。可以用 -PndkPath=D:/xxx 覆盖,或改下面的默认值。
    // (不用 local.properties 里的 ndk.dir,那个写法已被弃用)
    ndkPath project.findProperty('ndkPath') ?: 'C:/Users/Administrator/AppData/Local/Android/Sdk/ndk/android-ndk-r26d'

    defaultConfig {
        if (buildAsApplication) {
            applicationId "com.zcc.tanktv"
        }
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            // ndkBuild {
            //     arguments "APP_PLATFORM=android-19"
            //     abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            // }
            cmake {
                arguments "-DANDROID_APP_PLATFORM=android-21",
                          "-DANDROID_STL=c++_shared",
                          // SDL_mixer:不跑 external/ 下载脚本,只编实际需要的格式
                          // 游戏音效全是 .ogg,而 Mix_LoadWAV 对非 WAV 会 fallback 到
                          // Mix_LoadMusic_RW,所以 OGG 必须开(STB = stb_vorbis,零依赖)
                          "-DSDL2MIXER_VENDORED=OFF",
                          "-DSDL2MIXER_CMD=OFF",
                          "-DSDL2MIXER_VORBIS=STB",
                          "-DSDL2MIXER_FLAC=OFF",
                          "-DSDL2MIXER_MOD=OFF",
                          "-DSDL2MIXER_MP3=OFF",
                          "-DSDL2MIXER_MIDI=OFF",
                          "-DSDL2MIXER_OPUS=OFF",
                          "-DSDL2MIXER_WAVPACK=OFF",
                          "-DSDL2MIXER_GME=OFF"
                // 先只编 arm64-v8a(绝大多数 Android TV / 盒子都是它),编译快很多。
                // 需要别的 ABI 时把下面这行改成全部:
                //   abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            // ndkBuild {
            //     path 'jni/Android.mk'
            // }
            cmake {
                path 'jni/CMakeLists.txt'
            }
        }
       
    }
    lint {
        abortOnError false
    }

    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "org.libsdl.app.aar";
                    output.outputFile = new File(outputFile.parent, fileName);
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
